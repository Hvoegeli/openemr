<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clinical Co-pilot · Traces</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --good: #15803d;
      --warn-bg: #fef3c7;
      --warn-text: #78350f;
      --error: #b91c1c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      font-size: 0.9rem;
    }
    header .brand { font-weight: 600; }
    header .brand .accent { color: var(--accent); }
    header .right { color: var(--muted); font-size: 0.85rem; display: flex; gap: 0.75rem; align-items: center; }
    header a {
      color: var(--muted); text-decoration: none;
      padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.82rem;
    }
    header a:hover { color: var(--text); }
    main { padding: 1rem; overflow: auto; }

    .summary {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .stat {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 1rem;
    }
    .stat .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .value { font-size: 1.4rem; font-weight: 600; margin-top: 0.25rem; }

    table {
      width: 100%; border-collapse: collapse; background: var(--panel);
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
      font-size: 0.85rem;
    }
    th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: #fafafb; cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    .ok { color: var(--good); }
    .warn { background: var(--warn-bg); color: var(--warn-text); padding: 0 0.4rem; border-radius: 4px; }
    .err { color: var(--error); }
    .pill { background: #f3f4f6; color: var(--muted); padding: 0.05rem 0.4rem; border-radius: 4px; font-size: 0.75rem; }

    pre.detail {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem; margin-top: 1rem; overflow: auto; font-size: 0.78rem;
      white-space: pre-wrap; word-break: break-word;
    }
    .empty { color: var(--muted); font-style: italic; padding: 2rem; text-align: center; }
    .note { color: var(--muted); font-size: 0.8rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Clinical <span class="accent">Co-pilot</span> · Traces</div>
    <div class="right">
      <a href="/">← Back to chat</a>
    </div>
  </header>
  <main>
    <div class="summary" id="summary"></div>
    <table>
      <thead>
        <tr>
          <th>Started</th>
          <th>User msg</th>
          <th>Status</th>
          <th class="num">Latency</th>
          <th class="num">Tools</th>
          <th class="num">Tokens (in / out)</th>
          <th class="num">Cost (USD)</th>
          <th class="num">Validator</th>
          <th class="num">Hops</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="9" class="empty">Loading…</td></tr>
      </tbody>
    </table>
    <p class="note">Bounded ring buffer (last 200 requests, in-memory). Refreshes every 5s.</p>
    <pre class="detail" id="detail" hidden></pre>
  </main>

  <script>
    const fmtMs = (ms) => ms == null ? "—" : (ms < 1000 ? `${ms.toFixed(0)}ms` : `${(ms/1000).toFixed(2)}s`);
    const fmtUsd = (n) => n == null ? "—" : `$${n.toFixed(6)}`;
    const fmtTime = (epoch) => {
      const d = new Date(epoch * 1000);
      return d.toLocaleTimeString();
    };
    const truncate = (s, n) => (s && s.length > n) ? s.slice(0, n) + "…" : (s || "");

    async function load() {
      const r = await fetch("/api/traces?limit=50", { credentials: "include" });
      if (r.status === 401 || r.redirected) { location.href = "/login"; return; }
      const j = await r.json();
      render(j.items || []);
    }

    function render(items) {
      const tb = document.getElementById("rows");
      const sum = document.getElementById("summary");
      if (!items.length) {
        tb.innerHTML = '<tr><td colspan="9" class="empty">No traces yet — send a chat turn.</td></tr>';
        sum.innerHTML = "";
        return;
      }
      const totalCost = items.reduce((a, t) => a + (t.cost_usd || 0), 0);
      const totalTokIn = items.reduce((a, t) => a + (t.total_usage?.input_tokens || 0), 0);
      const totalTokOut = items.reduce((a, t) => a + (t.total_usage?.output_tokens || 0), 0);
      const failed = items.filter(t => t.error || t.validator_failed).length;
      const lat = items.map(t => t.duration_ms).filter(x => x != null).sort((a,b)=>a-b);
      const p50 = lat.length ? lat[Math.floor(lat.length * 0.5)] : null;
      const p95 = lat.length ? lat[Math.floor(lat.length * 0.95)] : null;
      sum.innerHTML = `
        <div class="stat"><div class="label">Requests</div><div class="value">${items.length}</div></div>
        <div class="stat"><div class="label">Latency p50 / p95</div><div class="value">${fmtMs(p50)} / ${fmtMs(p95)}</div></div>
        <div class="stat"><div class="label">Tokens (in / out)</div><div class="value">${totalTokIn.toLocaleString()} / ${totalTokOut.toLocaleString()}</div></div>
        <div class="stat"><div class="label">Total cost</div><div class="value">${fmtUsd(totalCost)}</div></div>
        <div class="stat"><div class="label">Errors / validator-fail</div><div class="value">${failed}</div></div>
      `;
      tb.innerHTML = items.map(t => {
        const status = t.error
          ? `<span class="err">err</span>`
          : (t.validator_failed ? `<span class="warn">validator</span>` : `<span class="ok">ok</span>`);
        return `<tr data-id="${t.request_id}">
          <td>${fmtTime(t.started_at)}</td>
          <td>${truncate(t.user_msg, 60)}</td>
          <td>${status}</td>
          <td class="num">${fmtMs(t.duration_ms)}</td>
          <td class="num">${(t.tool_events || []).length}</td>
          <td class="num">${(t.total_usage?.input_tokens || 0).toLocaleString()} / ${(t.total_usage?.output_tokens || 0).toLocaleString()}</td>
          <td class="num">${fmtUsd(t.cost_usd)}</td>
          <td class="num">${t.validator_attempts || 0}</td>
          <td class="num">${t.route_count || 0}</td>
        </tr>`;
      }).join("");
      tb.querySelectorAll("tr[data-id]").forEach(tr => {
        tr.addEventListener("click", async () => {
          const id = tr.getAttribute("data-id");
          const r = await fetch(`/api/traces/${id}`, { credentials: "include" });
          if (!r.ok) return;
          const j = await r.json();
          const det = document.getElementById("detail");
          det.hidden = false;
          det.textContent = JSON.stringify(j, null, 2);
          det.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
