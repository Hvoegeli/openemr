<!doctype html>
<!--
  Phase 2.4 — minimal upload UI.

  Plain HTML + vanilla JS (no framework, no build step) — the chat UI is
  Angular and we deliberately don't pull that in here. This page is the
  dev/demo surface for the multipart `/api/upload` endpoint until the
  upload flow lands in the chat sidebar in a later phase.

  Both dropdowns populate from server-side endpoints (so adding a new
  doc_type or onboarding a new patient flows through to the dropdown
  without any frontend edit). The patient list is filtered by the same
  per-user ACL the chat uses — no leakage of off-panel patients.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Upload Clinical Document — Co-pilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --ink: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --ok: #15803d;
    --err: #b91c1c;
    --code: #0f172a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
  }
  header {
    max-width: 820px;
    margin: 0 auto 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header a { color: var(--muted); text-decoration: none; font-size: 13px; }
  header a:hover { text-decoration: underline; }
  .card {
    max-width: 820px;
    margin: 0 auto 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  select, input[type="file"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: white;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .status {
    margin-top: 16px;
    font-size: 13px;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  pre {
    background: var(--code);
    color: #e2e8f0;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 12px;
    line-height: 1.5;
    margin: 0;
  }
  .meta {
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .meta strong { color: var(--ink); font-weight: 600; }

  /* Dedup-prompt modal — appears on HTTP 409 from /api/upload when the
     SHA-256 of the uploaded bytes matches a DocumentReference already on
     the patient's chart. Two actions: use existing (re-submit with
     acknowledge_existing=true) or cancel. */
  .dedup-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000;
  }
  .dedup-overlay.open { display: flex; }
  .dedup-modal {
    background: var(--panel, #fff);
    border-radius: 10px;
    padding: 24px 28px;
    max-width: 520px;
    width: calc(100% - 2rem);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }
  .dedup-modal h2 {
    margin: 0 0 8px;
    font-size: 18px;
    color: var(--ink, #0f172a);
  }
  .dedup-modal p {
    margin: 0 0 12px;
    color: #475569;
    line-height: 1.5;
    font-size: 14px;
  }
  .dedup-modal .existing-row {
    background: #f1f5f9;
    border-radius: 6px;
    padding: 10px 12px;
    margin: 12px 0 16px;
    font-size: 13px;
  }
  .dedup-modal .existing-row .k {
    color: #64748b; margin-right: 6px;
  }
  .dedup-modal .actions {
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .dedup-modal button {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border, #cbd5e1);
    background: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  .dedup-modal button.primary {
    background: var(--accent, #2563eb);
    color: #fff;
    border-color: var(--accent, #2563eb);
  }
  .dedup-modal button:hover { filter: brightness(0.95); }
</style>
</head>
<body>
<header>
  <h1>Upload Clinical Document</h1>
  <a href="/">← Back to chat</a>
</header>

<form id="f" class="card" autocomplete="off">
  <div class="field">
    <label for="patient">Patient</label>
    <select id="patient" required>
      <option value="">Loading…</option>
    </select>
    <div class="hint">Only patients you have access to are listed.</div>
  </div>

  <div class="field">
    <label for="doc-type">Document type</label>
    <select id="doc-type" required>
      <option value="">Loading…</option>
    </select>
  </div>

  <div class="field">
    <label for="file">File (PDF, PNG, or JPEG)</label>
    <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" required />
  </div>

  <button id="submit" type="submit">Upload &amp; extract</button>
  <div id="status" class="status"></div>
</form>

<div id="result-card" class="card" style="display:none">
  <div class="meta" id="result-meta"></div>
  <pre id="result-body"></pre>
</div>

<div id="dedup-overlay" class="dedup-overlay" role="dialog" aria-modal="true" aria-labelledby="dedup-title">
  <div class="dedup-modal">
    <h2 id="dedup-title">This file is already on the chart</h2>
    <p id="dedup-msg">The bytes you're uploading match a DocumentReference already attached to this patient.</p>
    <div class="existing-row" id="dedup-existing">
      <div><span class="k">Filename:</span><span id="dedup-filename">—</span></div>
      <div><span class="k">Date:</span><span id="dedup-date">—</span></div>
      <div><span class="k">Reference:</span><span id="dedup-ref" style="font-family:monospace">—</span></div>
    </div>
    <div class="actions">
      <button type="button" id="dedup-cancel">Cancel upload</button>
      <button type="button" id="dedup-use-existing" class="primary">Use existing copy</button>
    </div>
  </div>
</div>

<script>
(async () => {
  const $patient = document.getElementById('patient');
  const $docType = document.getElementById('doc-type');
  const $file = document.getElementById('file');
  const $form = document.getElementById('f');
  const $submit = document.getElementById('submit');
  const $status = document.getElementById('status');
  const $resultCard = document.getElementById('result-card');
  const $resultMeta = document.getElementById('result-meta');
  const $resultBody = document.getElementById('result-body');

  // Render a {items: [{id,label}]} payload into a <select>
  function fillSelect(el, items, placeholder) {
    el.innerHTML = '';
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = placeholder;
    el.appendChild(blank);
    for (const it of items) {
      const opt = document.createElement('option');
      opt.value = it.id;
      opt.textContent = it.label;
      el.appendChild(opt);
    }
  }

  function setStatus(msg, kind) {
    $status.textContent = msg;
    $status.className = 'status ' + (kind || '');
  }

  // Bootstrap both dropdowns in parallel; if either fails, the user still
  // gets a usable error rather than an indefinite "Loading…"
  try {
    const [pr, dr] = await Promise.all([
      fetch('/api/upload/patients').then(r => r.ok ? r.json() : Promise.reject('patients ' + r.status)),
      fetch('/api/upload/doc-types').then(r => r.ok ? r.json() : Promise.reject('doc-types ' + r.status)),
    ]);
    fillSelect($patient, pr.items, '— Select patient —');
    fillSelect($docType, dr.items, '— Select document type —');
  } catch (err) {
    setStatus('Failed to load form options: ' + err, 'err');
    return;
  }

  $form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = $file.files[0];
    if (!file) { setStatus('Pick a file first.', 'err'); return; }
    if (!$patient.value) { setStatus('Pick a patient.', 'err'); return; }
    if (!$docType.value) { setStatus('Pick a document type.', 'err'); return; }

    $submit.disabled = true;
    setStatus('Uploading + extracting (this can take ~10–30s on first run)…', '');
    $resultCard.style.display = 'none';

    await postUpload({acknowledgeExisting: false});
  });

  // Dedup-prompt modal wiring. The first POST to /api/upload sets
  // acknowledgeExisting=false, so a SHA-256 collision against an existing
  // DocumentReference comes back as HTTP 409. Open the modal, let the
  // user pick "Use existing" (re-POST with acknowledge_existing=true,
  // which short-circuits to the writer's idempotency path) or "Cancel"
  // (close the modal, reset the submit state, do nothing).
  const $dedupOverlay = document.getElementById('dedup-overlay');
  const $dedupFilename = document.getElementById('dedup-filename');
  const $dedupDate = document.getElementById('dedup-date');
  const $dedupRef = document.getElementById('dedup-ref');
  const $dedupCancel = document.getElementById('dedup-cancel');
  const $dedupUseExisting = document.getElementById('dedup-use-existing');

  function openDedupModal(detail) {
    const ex = (detail && detail.existing) || {};
    $dedupFilename.textContent = ex.filename || ex.title || '(unknown)';
    $dedupDate.textContent = ex.date
      ? new Date(ex.date).toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'})
      : '—';
    $dedupRef.textContent = ex.ref || '—';
    $dedupOverlay.classList.add('open');
  }
  function closeDedupModal() {
    $dedupOverlay.classList.remove('open');
  }
  $dedupCancel.addEventListener('click', () => {
    closeDedupModal();
    setStatus('Upload cancelled — duplicate file.', '');
    $submit.disabled = false;
  });
  $dedupUseExisting.addEventListener('click', async () => {
    closeDedupModal();
    setStatus('Using existing copy on the chart…', '');
    await postUpload({acknowledgeExisting: true});
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $dedupOverlay.classList.contains('open')) {
      closeDedupModal();
      $submit.disabled = false;
      setStatus('Upload cancelled — duplicate file.', '');
    }
  });

  async function postUpload({acknowledgeExisting}) {
    const file = $file.files[0];
    if (!file) { setStatus('Pick a file first.', 'err'); $submit.disabled = false; return; }

    const fd = new FormData();
    fd.append('file', file);
    fd.append('doc_type', $docType.value);
    fd.append('patient_uuid', $patient.value);
    if (acknowledgeExisting) fd.append('acknowledge_existing', 'true');

    let resp;
    try {
      resp = await fetch('/api/upload', { method: 'POST', body: fd });
    } catch (err) {
      setStatus('Network error: ' + err, 'err');
      $submit.disabled = false;
      return;
    }

    let body;
    try { body = await resp.json(); }
    catch { body = { detail: 'non-JSON response' }; }

    if (resp.status === 409) {
      const detail = (body && typeof body.detail === 'object') ? body.detail : null;
      if (detail && detail.code === 'duplicate_file') {
        openDedupModal(detail);
        return;
      }
      // Fallback for any other 409 shape — treat as plain error.
    }

    if (!resp.ok) {
      const msg = (body && body.detail && typeof body.detail === 'string')
        ? body.detail
        : (body && body.detail && body.detail.message) || JSON.stringify(body.detail || body);
      setStatus('Upload failed (HTTP ' + resp.status + '): ' + msg, 'err');
      $submit.disabled = false;
      return;
    }

    setStatus('Done.', 'ok');
    // Build the meta panel via DOM nodes (textContent on each value) so an
    // unexpected response field can't smuggle HTML into the page. Today
    // every value comes from OpenEMR + the Pydantic-validated extraction,
    // both trusted, but defense-in-depth costs nothing here.
    function row(label, value) {
      const wrap = document.createElement('div');
      wrap.appendChild(document.createTextNode(label + ': '));
      const v = document.createElement('strong');
      v.textContent = String(value);
      wrap.appendChild(v);
      return wrap;
    }
    $resultMeta.replaceChildren(
      row('DocumentReference', body.reference_id),
      row('SHA-256', (body.sha256 || '').slice(0, 16) + '…'),
      row('Newly created', body.created),
    );
    $resultBody.textContent = JSON.stringify(body.extracted, null, 2);
    $resultCard.style.display = 'block';
    $submit.disabled = false;
  }
})();
</script>
</body>
</html>
