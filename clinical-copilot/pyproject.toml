[project]
name = "agent-forge"
version = "0.1.0"
description = "Clinical co-pilot agent over OpenEMR FHIR"
requires-python = ">=3.12"
dependencies = [
    # Config
    "python-dotenv>=1.0",
    "pydantic-settings>=2.5",
    # LLM + agent
    "anthropic>=0.40",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langgraph>=0.2",
    # Observability
    "langsmith>=0.1.140",
    # FHIR / HTTP
    "httpx>=0.27",
    # Web app (added later)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=47.0.0",
    "pyjwt>=2.12.1",
    "reportlab>=4.4.10",
    "matplotlib>=3.10.9",
    "markdown>=3.10.2",
    "itsdangerous>=2.2",
    # Eval suite
    "pyyaml>=6.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
