[project]
name = "agent-forge"
version = "0.1.0"
description = "Clinical co-pilot agent over OpenEMR FHIR"
requires-python = ">=3.12"
dependencies = [
    # Config
    "python-dotenv>=1.0",
    "pydantic-settings>=2.5",
    # LLM + agent
    "anthropic>=0.40",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    # BAA-grade path: when llm_provider="bedrock" we route Claude calls
    # through AWS Bedrock instead of Anthropic direct so a real hospital
    # deployment can sign Anthropic's BAA (only available via Bedrock).
    # Pulled in always so the env-var flip is one step, not a re-install.
    "langchain-aws>=0.2",
    "langgraph>=0.2",
    # Observability
    "langsmith>=0.1.140",
    # FHIR / HTTP
    "httpx>=0.27",
    # Web app (added later)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=47.0.0",
    "pyjwt>=2.12.1",
    "reportlab>=4.4.10",
    "matplotlib>=3.10.9",
    "markdown>=3.10.2",
    "itsdangerous>=2.2",
    # Eval suite
    "pyyaml>=6.0",
    "rich>=13.7",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "python-multipart>=0.0.10",
    "rank-bm25>=0.2.2",
    # Dense embeddings for the guideline retriever's hybrid (sparse +
    # dense) stage. BGE-small-en-v1.5 is a 384-dim retrieval-tuned model
    # (~130MB on disk) that runs comfortably on Hetzner's CPU. Pulls in
    # torch (CPU-only wheels by default on Linux x86_64). Marker excludes
    # macOS x86_64 (Intel Mac dev boxes) where modern torch wheels don't
    # exist — local dev on Intel Mac runs without the dense stage and
    # `app/guidelines/retrieve.py` falls back to BM25-only with a
    # warning. Hetzner (linux_x86_64) and Apple-Silicon Macs install
    # the dep normally. See app/guidelines/embed.py for the rationale
    # on staying local instead of routing through Bedrock/OpenAI/Voyage.
    "sentence-transformers>=3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # .xlsx workbook parser. Pure-Python, no native deps. Used by the
    # workbook doc-type ingest path — deterministic, zero LLM credit.
    "openpyxl>=3.1",
    # OCR for the image-channel jailbreak quarantine (C1). pytesseract is
    # a thin Python wrapper around the `tesseract` system binary, which
    # must be installed separately — `brew install tesseract` on macOS,
    # `apt install tesseract-ocr` on Debian/Ubuntu. App startup verifies
    # the binary is present via `pytesseract.get_tesseract_version()` and
    # fails closed if it's missing, so a deploy that skipped the install
    # cannot silently disable the image-channel scan.
    "pytesseract>=0.3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# `asyncio_mode = auto` lets us write `async def test_…` without
# decorating each test with `@pytest.mark.asyncio`. Strict mode (the
# default) requires the decorator on every test; this saves boilerplate
# and keeps async/sync tests visually consistent.
asyncio_mode = "auto"
