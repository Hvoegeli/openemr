# Logical demo-patient registry for the eval suite.
#
# Cases declare a `patient_selector` (e.g. `tag: no_bp_charted`); the runner
# expands that to a list of patient ids by looking here. When you seed a new
# demo patient (see scripts/seed_*.py), add a row below with appropriate
# tags so existing cases can exercise it.
#
# Tags are documentation-driven (i.e. you assert here what the patient's data
# looks like). The runner trusts the tag → snapshot. If you change the
# underlying seed data, refresh tags here AND re-record snapshots.

